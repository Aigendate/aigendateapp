services:
  postgres:
    image: postgres:16-alpine
    container_name: turnos_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos
      POSTGRES_DB: turnos
    volumes:
      - turnos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  turnos_pgdata:
